services:
  airflow:
    image: apache/airflow:2.9.0
    environment:
      - _PIP_ADDITIONAL_REQUIREMENTS=duckdb==1.5.2 dbt-core==1.7.0 dbt-duckdb==1.7.0 requests beautifulsoup4 pandas
      - DUCKDB_PATH=/opt/airflow/data/realestate.duckdb
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__WEBSERVER__WEB_SERVER_HOST=0.0.0.0
      # Secrets come from the git-ignored .env file (copy .env.example to .env)
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in .env}
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_SECRET_KEY:?Set AIRFLOW_SECRET_KEY in .env}
      - AIRFLOW_ADMIN_USER=${AIRFLOW_ADMIN_USER:-admin}
      - AIRFLOW_ADMIN_PASSWORD=${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scraper:/opt/airflow/scraper
      - ./conversion:/opt/airflow/conversion
      - ./dbt_project:/opt/airflow/dbt_project
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
    ports:
      # Only reachable from this computer, not from the rest of the network
      - "127.0.0.1:8080:8080"
    command: >
      bash -c "
        airflow db init &&
        sleep 5 &&
        airflow users create --username \"$$AIRFLOW_ADMIN_USER\" --password \"$$AIRFLOW_ADMIN_PASSWORD\" --firstname Admin --lastname User --role Admin --email admin@example.com || true &&
        airflow webserver --port 8080 &
        sleep 10 &&
        airflow scheduler
      "
